name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # e2e runs against a running stack, as it does locally. CI has no claude, scout.py or treg,
      # so the page shows them missing; the spec checks the page agrees with /api/health.
      - name: e2e
        run: |
          pnpm --filter @gradcode/e2e exec playwright install --with-deps chromium
          pnpm --filter @gradcode/server start &
          pnpm --filter @gradcode/web dev &
          for _ in $(seq 60); do curl -fs http://127.0.0.1:5174/api/health >/dev/null && break; sleep 1; done
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
